[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-lint"
version = "0.1.5"
description = "CLI tool that grades prompts 0-100 against 10 engineering principles and rewrites them, with any LLM provider via LiteLLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "khadar", email = "khadarbashajilan001@gmail.com" }]
requires-python = ">=3.12"
keywords = ["prompt", "prompt-engineering", "llm", "litellm", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = [
    "langchain-core>=0.3.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "litellm>=1.50.0",
]

[project.urls]
Homepage = "https://github.com/khadarbashajilan/prompt-optimizer-tool"
Issues = "https://github.com/khadarbashajilan/prompt-optimizer-tool/issues"

[project.scripts]
plint = "prompt_lint.cli:cli"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=6.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "eval"]
addopts = "-ra --strict-markers --strict-config"

