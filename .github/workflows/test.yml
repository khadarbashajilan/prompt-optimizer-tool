name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --all-groups

      - name: Offline test suite, no API key needed
        run: |
          uv run pytest -q \
            --cov=prompt_optimizer_tool \
            --cov-report=term \
            --cov-fail-under=94

      - name: CLI smoke test (no network)
        run: uv run prompt-optimizer list
